name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Branch, tag or commit to build
      emulator:
        description: Web player version, such as 0.40

jobs:
  configure-pages:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
    steps:
      - uses: actions/configure-pages@v5

  web:
    needs: configure-pages
    uses: picocomputer/.github/.github/workflows/web.yml@main
    with:
      source: ${{ inputs.source }}
      emulator: ${{ inputs.emulator }}
    permissions:
      contents: read
      pages: write
      id-token: write
